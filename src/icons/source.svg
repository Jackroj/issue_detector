<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- magnifying glass -->
  <circle cx="52" cy="54" r="27" fill="none" stroke="#ffffff" stroke-width="9"/>
  <line x1="72" y1="74" x2="97" y2="99" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- pulse / activity line inside the lens -->
  <polyline points="38,55 46,55 50,44 57,66 62,52 68,52"
            fill="none" stroke="#ffffff" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- alert badge -->
  <circle cx="83" cy="29" r="12" fill="#4f46e5"/>
  <circle cx="83" cy="29" r="9.5" fill="#f59e0b"/>
</svg>
